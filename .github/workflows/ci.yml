name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
        env:
          RABBITMQ_DEFAULT_USER: eproc
          RABBITMQ_DEFAULT_PASS: eproc
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DATABASE: eproc_test
      REDIS_ADDR: localhost:6379
      RABBITMQ_URL: amqp://eproc:eproc@localhost:5672/
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build all services
        run: |
          mkdir -p bin
          for svc in api-gateway auth-service vendor-service tender-service bid-service po-service approval-service audit-service reporting-service; do
            go build -trimpath -o bin/$svc ./cmd/$svc
          done

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.74.0"
      - name: Lint protos
        run: buf lint
      - name: Check generated code is current
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate
          git diff --exit-code proto/gen

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.service
          build-args: SERVICE=vendor-service
          push: false
          tags: eproc/vendor-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
