version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    paths:
      - proto/gen
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - contextcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ank/e-proc
