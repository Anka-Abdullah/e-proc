name: eproc

services:
  mongo:
    image: mongo:8
    container_name: eproc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eproc
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: eproc-redis
    restart: unless-stopped
    ports:
      # 6379 sudah dipakai instance Redis lain di mesin ini; pakai 6380 di host.
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: eproc-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eproc}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eproc}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  auth-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: auth-service
    container_name: eproc-auth
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8088"
      GRPC_ADDR: ":9098"
    ports:
      - "8008:8088"
      - "9098:9098"

  api-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    container_name: eproc-api-gateway
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: &app_env
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-eproc}
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-eproc}:${RABBITMQ_PASSWORD:-eproc}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: ${JWT_TTL:-12h}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-50000000}
    ports:
      - "8000:8080"

  vendor-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: vendor-service
    container_name: eproc-vendor
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9081"
    ports:
      - "8001:8081"
      - "9081:9081"

  tender-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: tender-service
    container_name: eproc-tender
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9082"
    ports:
      - "8002:8082"
      - "9082:9082"

  bid-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: bid-service
    container_name: eproc-bid
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8083"
      GRPC_ADDR: ":9083"
    ports:
      - "8003:8083"
      - "9083:9083"

  po-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: po-service
    container_name: eproc-po
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8084"
      GRPC_ADDR: ":9084"
    ports:
      - "8004:8084"
      - "9084:9084"

  approval-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: approval-service
    container_name: eproc-approval
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8085"
      GRPC_ADDR: ":9085"
    ports:
      - "8005:8085"
      - "9085:9085"

  audit-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: audit-service
    container_name: eproc-audit
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8086"
      GRPC_ADDR: ":9086"
    ports:
      # 8086 dipakai OrbStack (tinyrdm) di mesin ini; audit-service pindah ke 8006.
      - "8006:8086"
      - "9086:9086"

  reporting-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: reporting-service
    container_name: eproc-reporting
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app_env
      HTTP_ADDR: ":8087"
      GRPC_ADDR: ":9087"
    ports:
      - "8007:8087"
      - "9087:9087"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    container_name: eproc-web
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data:
