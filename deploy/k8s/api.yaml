apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: eproc
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: eproc/api-gateway:latest
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9099 }
          envFrom:
            - configMapRef: { name: eproc-config }
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9099"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: eproc-secrets, key: JWT_SECRET }
          # /readyz reports per-upstream status, so a gateway pod is only ready
          # when it can actually serve requests.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eproc
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
