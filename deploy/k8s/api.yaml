# The eight domain services and the API gateway.
#
# Each Deployment is single-purpose: one binary, one port pair (HTTP + gRPC),
# probes on the service's own /healthz and /readyz, and configuration from the
# ConfigMap plus the JWT secret. Replace `image:` with your registry path.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: eproc
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: eproc/auth-service:latest
          ports:
            - { name: http, containerPort: 8088 }
            - { name: grpc, containerPort: 9098 }
          envFrom:
            - configMapRef: { name: eproc-config }
          env:
            - name: HTTP_ADDR
              value: ":8088"
            - name: GRPC_ADDR
              value: ":9098"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: eproc-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: eproc
spec:
  selector: { app: auth-service }
  ports:
    - { name: http, port: 8088, targetPort: http }
    - { name: grpc, port: 9098, targetPort: grpc }
---
