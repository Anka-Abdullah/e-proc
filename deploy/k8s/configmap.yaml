apiVersion: v1
kind: ConfigMap
metadata:
  name: eproc-config
  namespace: eproc
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"

  # Point these at your managed datastores.
  MONGO_URI: "mongodb://mongo.eproc.svc.cluster.local:27017"
  MONGO_DATABASE: "eproc"
  REDIS_ADDR: "redis.eproc.svc.cluster.local:6379"
  RABBITMQ_URL: "amqp://eproc:CHANGE_ME@rabbitmq.eproc.svc.cluster.local:5672/"

  # Business rules
  APPROVAL_THRESHOLD: "50000000"
  AUTO_CLOSE_INTERVAL: "1m"
  APPROVAL_ASSIGNEE: "u-approver"
  APPROVAL_REMINDER_AFTER: "24h"
  REMINDER_INTERVAL: "1h"
  REPORT_INTERVAL: "24h"
  RATE_LIMIT_RPS: "300"

  # Service-to-service addressing inside the cluster
  AUTH_SERVICE_URL: "http://auth-service:8088"
  VENDOR_SERVICE_URL: "http://vendor-service:8081"
  TENDER_SERVICE_URL: "http://tender-service:8082"
  BID_SERVICE_URL: "http://bid-service:8083"
  PO_SERVICE_URL: "http://po-service:8084"
  APPROVAL_SERVICE_URL: "http://approval-service:8085"
  AUDIT_SERVICE_URL: "http://audit-service:8086"
  REPORTING_SERVICE_URL: "http://reporting-service:8087"
  TENDER_GRPC_ADDR: "tender-service:9082"

  # The browser origin allowed by the gateway's CORS. Set this to your real host.
  FRONTEND_ORIGIN: "http://localhost:3000"
