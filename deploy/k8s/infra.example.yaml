# Example in-cluster datastores — for development and demos only.
#
# Single replica, no authentication between components, ephemeral storage. A real
# deployment should use managed MongoDB, Redis and RabbitMQ and point
# configmap.yaml at them. This file exists so the manifests can be applied end to
# end on a laptop cluster without hunting for external services first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: eproc
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports:
            - { name: mongo, containerPort: 27017 }
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: eproc
spec:
  selector: { app: mongo }
  ports:
    - { name: mongo, port: 27017, targetPort: mongo }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: eproc
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - { name: redis, containerPort: 6379 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: eproc
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: eproc
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "eproc"
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: eproc-secrets, key: RABBITMQ_PASSWORD }
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: ui, containerPort: 15672 }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: eproc
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: ui, port: 15672, targetPort: ui }
