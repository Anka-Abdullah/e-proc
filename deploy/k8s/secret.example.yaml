# Copy to secret.yaml, fill in real values, and keep it out of git.
#
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#   kubectl apply -f deploy/k8s/secret.yaml
#
# With APP_ENV=production the services refuse to start while JWT_SECRET is still
# the development default, so this file is required for a real deployment.
#
# Better than a manifest: create it imperatively so the value never lands on disk,
#
#   kubectl -n eproc create secret generic eproc-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=RABBITMQ_PASSWORD='...' \
#     --from-literal=MONGO_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: eproc-secrets
  namespace: eproc
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_use_openssl_rand_base64_48"
  RABBITMQ_PASSWORD: "CHANGE_ME"
  MONGO_PASSWORD: "CHANGE_ME"
