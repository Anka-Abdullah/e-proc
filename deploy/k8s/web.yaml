# Frontend. NEXT_PUBLIC_API_URL is baked into the client bundle at build time, so
# it must point at a URL the *browser* can reach (the ingress host), not at a
# cluster-internal service name. Build it accordingly:
#
#   docker build -f deploy/docker/Dockerfile.web \
#     --build-arg NEXT_PUBLIC_API_URL=https://eproc.example.com \
#     -t eproc/web:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eproc
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: eproc/web:latest
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eproc
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 3000, targetPort: http }
