syntax = "proto3";

package eproc.approval.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

option go_package = "github.com/ank/e-proc/proto/gen/approval/v1;approvalv1";

// ApprovalStatus is the state of one approval request.
enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_REJECTED = 3;
  APPROVAL_STATUS_CANCELLED = 4;
}

// ApprovalStep records one actor's decision in the history.
message ApprovalStep {
  string actor_id = 1;
  ApprovalStatus decision = 2;
  string comment = 3;
  google.protobuf.Timestamp decided_at = 4;
}

// Approval is the workflow instance attached to a business document.
message Approval {
  string id = 1;
  string tenant_id = 2;
  string entity_type = 3;
  string entity_id = 4;
  eproc.common.v1.Money amount = 5;
  ApprovalStatus status = 6;
  string requested_by = 7;
  string assigned_to = 8;
  repeated ApprovalStep history = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string comment = 12;
}

message RequestApprovalRequest {
  string tenant_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  eproc.common.v1.Money amount = 4;
  string requested_by = 5;
  string assigned_to = 6;
}
message RequestApprovalResponse { Approval approval = 1; }

message DecideApprovalRequest {
  string tenant_id = 1;
  string id = 2;
  bool approve = 3;
  string comment = 4;
  string actor_id = 5;
}
message DecideApprovalResponse { Approval approval = 1; }

message GetApprovalRequest {
  string tenant_id = 1;
  string id = 2;
}
message GetApprovalResponse { Approval approval = 1; }

message ListApprovalsRequest {
  string tenant_id = 1;
  ApprovalStatus status = 2;
  string assigned_to = 3;
  eproc.common.v1.PageRequest page = 4;
}
message ListApprovalsResponse {
  repeated Approval approvals = 1;
  eproc.common.v1.PageResponse page = 2;
}

// ApprovalService runs the approval workflow and keeps its history.
service ApprovalService {
  rpc RequestApproval(RequestApprovalRequest) returns (RequestApprovalResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
}
